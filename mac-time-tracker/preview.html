    --line-strong: #3a3a4a; --text: #e8e8f0; --muted: #9a9ab2;

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--text);

  /* ------------------------------------------------------------ header -- */
  header {
    position: sticky; top: 0; z-index: 20; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .hrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 15px; font-weight: 650; margin: 0 6px 0 0; letter-spacing: -0.01em; white-space: nowrap; }
  .spacer { flex: 1 1 auto; }
  .btn {
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 6px 11px; transition: border-color 120ms, background 120ms;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.ghost { border-style: dashed; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 9px;
    border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap;
  }

  /* Week strip — the day pills, and the way back to any day in this week. */
  .week-strip { display: flex; gap: 6px; align-items: stretch; }
  .daypill {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 52px; padding: 6px 8px 7px; border-radius: 10px;

  .daypill:hover { border-color: var(--accent); }

  .daypill .met { width: 100%; height: 3px; border-radius: 99px; background: var(--line); }
  .daypill .met i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
  .daypill[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .daypill.future { opacity: 0.45; }

  .quicklog .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

  main { padding: 16px 18px 60px; max-width: 1500px; margin: 0 auto; }
  .panes { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }

  }

  /* ----------------------------------------------------------- progress -- */
  .goal { padding: 14px 16px; margin-bottom: 14px; }
  .goal .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 9px; }
  .goal .headline { font-weight: 650; font-size: 15px; letter-spacing: -0.01em; }
  .goal .headline.ok { color: var(--ok); }
  .goal .headline.warn { color: var(--warn); }

  .meter { position: relative; height: 12px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }

  .goal .mark { position: relative; height: 14px; margin-top: 3px; }

  .goal .key { display: flex; gap: 14px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .goal .key i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* ---------------------------------------------------------- timeline -- */
  .tl { padding: 12px 12px 14px; position: sticky; top: 128px; }
  .tl-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }

  .tl-hint { font-size: 11px; color: var(--muted); }
  .tl-grid { position: relative; margin-left: 44px; border-left: 1px solid var(--line); }
  .tl-hour { position: absolute; left: -44px; right: 0; border-top: 1px dashed var(--line); }
  .tl-hour span {
    position: absolute; left: 0; top: -7px; width: 38px; text-align: right;
    font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .tl-block {
    position: absolute; left: 6px; right: 4px; border-radius: 7px; padding: 4px 7px; overflow: hidden;
    background: hsl(var(--h) var(--cl-s) var(--cl-l)); color: #fff;
    border: 1px solid hsl(var(--h) var(--cl-s) calc(var(--cl-l) - 10%));
    cursor: grab; touch-action: none; user-select: none;

  .tl-block:active { cursor: grabbing; }
  .tl-block.dragging { z-index: 5; box-shadow: 0 8px 20px rgba(0,0,0,0.28); }

  .tick {

  .tick svg { width: 13px; height: 13px; }

  var state = {};
  Object.keys(DATA.scenarios).forEach(function (key) {
    var scenario = DATA.scenarios[key];
    state[scenario.date] = JSON.parse(JSON.stringify(scenario));
  });

  function day(date) { return state[date] || state[current]; }

  /**
   * The server attaches this to every entry on the way out: the task the time
   * will actually be logged against, looked up by id. The preview must do the
   * same, or picking a task from search would show a stale name -- the exact
   * bug this replaced.
   */
  function resolve(entry) {
    var s = entry.suggestion;
    if (!entry.taskId) {
      return { taskId: null, taskName: null, listName: s.listName, folderName: s.folderName,
               spaceName: s.spaceName, url: null, stale: false };
    }
    var task = DATA.tasks.filter(function (t) { return t.taskId === entry.taskId; })[0];
    if (task) {
      return { taskId: task.taskId, taskName: task.taskName, listName: task.listName,
               folderName: task.folderName, spaceName: task.spaceName, url: task.url, stale: false };
    }
    if (entry.taskId === s.taskId && s.taskName) {
      return { taskId: entry.taskId, taskName: s.taskName, listName: s.listName,
               folderName: s.folderName, spaceName: s.spaceName, url: null, stale: false };
    }
    return { taskId: entry.taskId, taskName: null, listName: null, folderName: null,
             spaceName: null, url: null, stale: true };
  }
  function dress(entry) { entry.resolved = resolve(entry); return entry; }

  function summarise(d) {
    function total(fn) {
      return d.entries.filter(fn).reduce(function (sum, e) { return sum + e.durationMs; }, 0);
    }
    function live(e) { return e.status !== 'deleted'; }
    function counts(e) { return e.status !== 'deleted' && e.status !== 'rejected'; }
    return {
      trackedMs: total(live),
      pendingMs: total(function (e) { return e.status === 'pending'; }),
      approvedMs: total(function (e) { return e.status === 'approved'; }),
      syncedMs: total(function (e) { return e.status === 'synced'; }),
      billableMs: total(function (e) { return e.billable && counts(e); }),
      loggedMs: total(counts)

  function payload(date) {

      day: { date: d.date, updatedAt: Date.now(), entries: d.entries.map(dress) },
      summary: summarise(d),
      days: dates,
      catalogFetchedAt: Date.now(),
      taskCount: DATA.tasks.length,
      targets: DATA.targets,
      display: DATA.display,
      quickLog: DATA.quickLog
    };

  function handle(method, path, body) {
    var date = (body && body.date) || current;

    if (path.indexOf('/api/day?') === 0 || path === '/api/day') {
      var q = path.split('date=')[1];
      if (q) { date = decodeURIComponent(q); }
      if (state[date]) current = date;
      return payload(current);
    }

    if (path.indexOf('/api/week') === 0) {

        var d = state[iso];

            var r = e.resolved || e.suggestion;
            var c = r.folderName || r.spaceName || 'Unassigned';
            byClient[c] = (byClient[c] || 0) + e.durationMs;
          });
        }
        out.push({
          date: iso,
          summary: d ? summarise(d) : { trackedMs: 0, pendingMs: 0, approvedMs: 0, syncedMs: 0, billableMs: 0, loggedMs: 0 },
          byClient: byClient,

      }
      return { weekStart: out[0].date, days: out, targets: DATA.targets };
    }

      var term = decodeURIComponent((path.split('q=')[1] || '')).toLowerCase();
      var matches = DATA.tasks.filter(function (t) {
        return t.taskName.toLowerCase().indexOf(term) !== -1 ||
               (t.listName || '').toLowerCase().indexOf(term) !== -1 ||
               (t.folderName || '').toLowerCase().indexOf(term) !== -1;
      }).slice(0, 50);
      return { tasks: matches };
    }

    if (path.indexOf('/api/entry/') === 0) {
      var id = decodeURIComponent(path.slice('/api/entry/'.length));

      var entry = d.entries.filter(function (e) { return e.id === id; })[0];
      if (!entry) throw new Error('No such entry');
      if (entry.status === 'synced') throw new Error('Already pushed to ClickUp; edit it there instead.');

      if (body.taskId !== undefined) {
        // The suggestion is the record of what the matcher guessed and is
        // never overwritten; only the chosen task changes.
        if (body.taskId && body.taskId !== entry.suggestion.taskId) entry.corrected = true;
        entry.taskId = body.taskId;
      }
      if (typeof body.description === 'string') entry.description = body.description;
      if (typeof body.billable === 'boolean') entry.billable = body.billable;
      if (typeof body.durationMinutes === 'number') {
        entry.durationMs = Math.max(0, Math.round(body.durationMinutes)) * 60000;
        entry.end = entry.start + entry.durationMs;
      }
      if (typeof body.start === 'number') {
        entry.start = Math.round(body.start);
        entry.end = entry.start + entry.durationMs;
      }
      if (body.status) {
        if (body.status === 'approved' && !entry.taskId) throw new Error('Pick a task before approving.');
        entry.status = body.status;
      }
      return { entry: dress(entry), summary: summarise(d) };
    }

    if (path === '/api/entry') {
      var into = day(date);
      var grain = DATA.display.snapMinutes || 15;
      var mins = Math.max(DATA.display.minEntryMinutes || grain, Math.round((body.minutes || grain) / grain) * grain);
      var start = Number(body.start);
      if (!isFinite(start)) start = into.entries.length ? into.entries[0].start : Date.now();
      var blank = {
        id: 'manual-' + Math.round(start) + '-' + mins,
        date: into.date,
        start: start, end: start + mins * 60000,
        activeMs: mins * 60000, durationMs: mins * 60000,
        blockIds: [],
        evidence: { apps: ['Added by hand'], paths: [], titles: ['Added by hand'], urls: [] },

      });
      return { day: payload(date).day, approved: approved, summary: summarise(target) };
    }

    if (path === '/api/day/push') {

        summary: summarise(pushing)
      };
    }

      // Rolled up from the same day the timeline is showing, so the preview
      // shows the real shape of this view rather than invented numbers.
      var src = day(current);
      var seen = {};
      var order = [];
      src.entries.forEach(function (e) {
        if (e.status === 'deleted') return;
        (e.evidence.apps || []).forEach(function (name) {
          if (!seen[name]) { seen[name] = { app: name, activeMs: 0, hasPath: false, hasUrl: false, title: null, path: null, url: null }; order.push(name); }
          var row = seen[name];
          row.activeMs += e.durationMs / Math.max(1, e.evidence.apps.length);
          // An entry can span several apps, and its evidence is pooled. Give
          // file paths to the app that could plausibly have one so the preview

          var browserish = /Chrome|Safari|Firefox|Edge|Arc|Slack/.test(name);

          if (browserish && (e.evidence.urls || []).length) { row.hasUrl = true; row.url = row.url || e.evidence.urls[0]; }
          if ((e.evidence.titles || []).length) { row.title = row.title || e.evidence.titles[0]; }
        });
      });
      var BUNDLES = {
        'Photoshop': 'com.adobe.Photoshop', 'After Effects': 'com.adobe.AfterEffects',
        'Adobe Premiere Pro': 'com.adobe.PremierePro', 'Google Chrome': 'com.google.Chrome',
        'Slack': 'com.tinyspeck.slackmacgap', 'Microsoft Word': 'com.microsoft.Word',
        'Figma': 'com.figma.Desktop', 'Terminal': 'com.apple.Terminal'
      };
      var apps = order.map(function (name) {
        var row = seen[name];
        var samples = Math.max(1, Math.round(row.activeMs / 5000));
        return {
          app: name, bundleId: BUNDLES[name] || 'unknown',
          activeMs: Math.round(row.activeMs), samples: samples, lastSeen: Date.now(),
          titleRate: row.title ? 1 : 0,
          pathRate: row.hasPath ? 1 : 0,
          urlRate: row.hasUrl ? 1 : 0,
          exampleTitle: row.title, examplePath: row.path, exampleUrl: row.url
        };
      }).sort(function (a, b) { return b.activeMs - a.activeMs; });
      var total = apps.reduce(function (sum, a) { return sum + a.activeMs; }, 0);
      return {
        date: src.date,
        sampleIntervalSeconds: 5,
        observer: {
          lastSampleAt: Date.now() - 4000, ageSeconds: 4,
          totalSamples: Math.round(total / 5000), activeMs: total,
          idleSamples: 0, lockedSamples: 0,
          spoolPath: '~/Library/Application Support/MBDTimeTracker/observer.ndjson'
        },
        accessibility: 'granted',
        apps: apps
      };
    }

    if (path === '/api/catalog/refresh') {
      return { taskCount: DATA.tasks.length, fetchedAt: Date.now() };
    }

    if (path === '/api/quick-log') {
      var button = DATA.quickLog[body.index];
      if (!button) throw new Error('No such quick-log button.');
      var into = day(date);

      var end = into.entries.length
        ? Math.max.apply(null, into.entries.map(function (e) { return e.end; }))
        : Date.now();

        id: 'manual-' + Math.round(end) + '-' + body.index,
        date: into.date,
        start: end, end: end + mins * 60000,
        activeMs: mins * 60000, durationMs: mins * 60000,
        blockIds: [],
        evidence: { apps: ['Quick log'], paths: [], titles: [button.label], urls: [] },
        suggestion: {
          taskId: button.taskId || 'quick-' + body.index, taskName: button.taskName,
          listId: null, listName: 'Active list', folderName: null, spaceName: 'MBD Non billable',
          confidence: 1, reasons: ['logged with the "' + button.label + '" button'],
          alternatives: [], billable: button.billable
        },
        status: 'approved', taskId: button.taskId || 'quick-' + body.index,
        description: button.label, billable: button.billable, manual: true

      dress(entry);
      into.entries = into.entries.concat([entry]).sort(function (a, b) { return a.start - b.start; });

    }

    throw new Error('Not found: ' + path);
  }

  function reset(key) {
    var scenario = DATA.scenarios[key];
    state[scenario.date] = JSON.parse(JSON.stringify(scenario));
    current = scenario.date;

(function () {
  var host = document.getElementById('pv-scenarios');
  var keys = Object.keys(PREVIEW.scenarios);
  host.innerHTML = keys.map(function (key, i) {
    return '<button data-scenario="' + key + '" aria-pressed="' + (i === 0) + '">' +
      PREVIEW.scenarios[key].label + '</button>';
  }).join('');
  host.addEventListener('click', function (event) {
    var key = event.target.getAttribute && event.target.getAttribute('data-scenario');
    if (!key) return;
    var date = PREVIEW.reset(key);
    host.querySelectorAll('button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-scenario') === key));
    });
    // Re-enter the page's own load path so nothing about it is special-cased.
    var select = document.getElementById('date');
    select.value = date;
    select.dispatchEvent(new Event('change'));
  });
})();
</script>

      <div class="card tl" id="timeline"></div>
      <div class="ent-list" id="entries"></div>
    </div>
  </div>
  <div class="card wk" id="weekview" style="display:none"></div>
  <div id="trackview" style="display:none"></div>
</main>
<div id="toast"></div>
<script>
(function () {
  var state = {
    date: null, day: null, targets: null, quickLog: [], view: 'day', selected: null, week: null,
    tracking: null,
    display: { timezone: '', dayStartHour: 7, dayEndHour: 19, snapMinutes: 15, minEntryMinutes: 15 },
    window: { from: 7, to: 19, stretched: false }
  };

  var ICON_TICK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg>';
  var ICON_X = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';

  /* ------------------------------------------------------------ helpers -- */
  function fmt(ms) {
    var mins = Math.max(0, Math.round(ms / 60000));
    var h = Math.floor(mins / 60), m = mins % 60;
    return h > 0 ? h + 'h ' + String(m).padStart(2, '0') + 'm' : m + 'm';
  }
  function hoursOnly(ms) { return (ms / 3600000).toFixed(1) + 'h'; }
  /**
   * All times render in one explicit zone. On an installed tracker that is the
   * Mac's own zone; setting display.timezone pins it, so a shared preview shows
   * studio time rather than whatever zone the viewer's browser happens to be in.
   */
  var TZ;
  var fmtClock, fmtParts;
  function setTimezone(tz) {
    TZ = tz || undefined;
    fmtClock = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ });
    fmtParts = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: TZ });
  }
  setTimezone('');

  function clock(ts) { return fmtClock.format(new Date(ts)); }

  /** Minutes since midnight in the display zone — the timeline's coordinate space. */
  function minutesOfDay(ts) {
    var hm = clock(ts).split(':');
    return Number(hm[0]) * 60 + Number(hm[1]);
  }

  /** Today's date in the display zone. Never toISOString(), which is UTC and
      lands on yesterday all morning anywhere east of Greenwich. */
  function todayInZone() { return fmtParts.format(new Date()); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function basename(p) { return p.split('/').pop(); }
  function toast(message, isError) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.style.borderColor = isError ? 'var(--bad)' : 'var(--line-strong)';
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.style.display = 'none'; }, 4500);
  }
  // ---- preview stand-in for the local server -----------------------------
  // Same request shapes as the real API, answered from memory so the page can
  // be clicked through anywhere. Nothing here runs in the installed tracker.
  async function api(path, options) {
    await new Promise(function (r) { setTimeout(r, 90); });  // feel of a real round trip
    var body = options && options.body ? JSON.parse(options.body) : {};
    var method = (options && options.method) || 'GET';
    return PREVIEW.handle(method, path, body);
  }

  /**
   * A stable hue per client. Same folder name always lands on the same colour,
   * on every machine, with no palette to maintain.
   */
  var HUES = [259, 199, 154, 24, 336, 96, 217, 44, 280, 172];
  function hueFor(name) {
    if (!name) return null;
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return HUES[h % HUES.length];
  }
  /**
   * Always the resolved task, never the suggestion. entry.resolved is what
   * the time will actually be logged against; the suggestion is only what the
   * matcher guessed, and the two part ways the moment anyone corrects a match.
   */
  function taskOf(entry) {
    return entry.resolved || { taskName: null, listName: null, folderName: null, spaceName: null, stale: false };
  }
  function clientOf(entry) {
    var r = taskOf(entry);
    return r.folderName || r.spaceName || null;
  }
  function hueStyle(entry) {
    var hue = hueFor(clientOf(entry));
    return hue === null ? '' : ' style="--h:' + hue + '"';
  }

  function live(entries) { return entries.filter(function (e) { return e.status !== 'deleted'; }); }

  /* ----------------------------------------------------------- progress -- */
  function renderGoal(summary) {
    var el = document.getElementById('goal');
    if (!state.targets) { el.style.display = 'none'; return; }
    var dayMs = state.targets.dailyMinutes * 60000;
    var billTargetMs = state.targets.billableMinutes * 60000;
    var logged = summary.loggedMs || 0;
    var billable = Math.min(summary.billableMs || 0, logged);
    var other = logged - billable;
    var scale = Math.max(dayMs, billTargetMs, logged, 1);

    var cls, headline, aside;
    if (billable >= billTargetMs) {
      cls = 'ok';
      headline = 'Billable target met — ' + fmt(billable) + ' billable';
      aside = 'Anything else today is a bonus.';
    } else if (logged >= dayMs) {
      cls = 'warn';
      headline = fmt(logged) + ' logged, ' + fmt(billable) + ' billable';
      aside = 'Day minimum met. Swap in billable work if any is available — target is ' + fmt(billTargetMs) + '.';
    } else {
      cls = logged >= dayMs * 0.6 ? 'warn' : 'bad';
      headline = fmt(dayMs - logged) + ' short of the ' + fmt(dayMs) + ' day';
      aside = fmt(billable) + ' billable · ' + fmt(other) + ' non-billable. Meeting not logged? Use the buttons above.';
    }

    var bp = Math.min(100, (billable / scale) * 100);
    var op = Math.min(100 - bp, (other / scale) * 100);
    var mp = Math.min(100, (dayMs / scale) * 100);

    el.style.display = '';
    el.innerHTML =
      '<div class="top"><span class="headline ' + cls + '">' + headline + '</span>' +
      '<span class="aside">' + aside + '</span></div>' +
      '<div class="meter">' +
        '<div class="seg billable" style="left:0;width:' + bp + '%"></div>' +
        '<div class="seg other" style="left:' + bp + '%;width:' + op + '%"></div>' +
      '</div>' +
      (mp < 100 ? '<div class="mark"><i style="left:' + mp + '%"></i><span style="left:' + mp + '%">' + fmt(dayMs) + ' target</span></div>' : '') +
      '<div class="key"><span><i style="background:var(--ok)"></i>billable</span>' +
      '<span><i style="background:var(--muted);opacity:0.5"></i>non-billable</span></div>';
  }

  /* ------------------------------------------------------------ week bar -- */
  function renderWeekStrip() {
    var el = document.getElementById('weekstrip');
    if (!state.week) { el.innerHTML = ''; return; }
    var todayIso = todayInZone();
    el.innerHTML = state.week.days.slice(0, 5).map(function (d) {
      var target = (state.targets && state.targets.dailyMinutes * 60000) || 1;
      var pct = Math.min(100, (d.summary.loggedMs / target) * 100);
      var parts = d.date.split('-');
      var dow = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'][state.week.days.indexOf(d)];
      return '<button class="daypill' + (d.date > todayIso ? ' future' : '') + '" data-date="' + d.date + '"' +
        ' aria-current="' + (d.date === state.date) + '" title="' + fmt(d.summary.loggedMs) + ' logged">' +
        '<span class="dow">' + dow + '</span>' +
        '<span class="num">' + Number(parts[2]) + '</span>' +
        '<span class="met"><i style="width:' + pct + '%"></i></span></button>';
    }).join('');
  }

  /* ----------------------------------------------------------- timeline -- */
  var PX_PER_HOUR = 58;
  /** Grain of the whole interface — set by capture.roundToMinutes. */
  function snapMin() { return state.display.snapMinutes || 15; }
  function minMin() { return state.display.minEntryMinutes || snapMin(); }
  function snapTo(minutes) { return Math.round(minutes / snapMin()) * snapMin(); }

  /**
   * The working window, from config. It is expanded only if an entry genuinely
   * falls outside it — hiding recorded time would be worse than a longer axis —
   * and the page says so when that happens.
   */
  function timelineWindow(entries) {
    var from = state.display.dayStartHour;
    var to = state.display.dayEndHour;
    var stretched = false;
    entries.forEach(function (e) {
      var startH = minutesOfDay(e.start) / 60;
      var endH = startH + e.durationMs / 3600000;
      if (startH < from) { from = Math.floor(startH); stretched = true; }
      if (endH > to) { to = Math.ceil(endH); stretched = true; }
    });
    return { from: from, to: Math.max(to, from + 1), stretched: stretched };
  }

  function renderTimeline() {
    var el = document.getElementById('timeline');
    var entries = live(state.day.entries);
    if (!entries.length) {
      el.innerHTML = '<div class="tl-head"><span class="tl-title">Timeline</span></div>' +
        '<div class="tl-empty">Nothing recorded yet.</div>';
      return;
    }
    var win = timelineWindow(entries);
    var height = (win.to - win.from) * PX_PER_HOUR;

    var hours = '';
    for (var h = win.from; h <= win.to; h++) {
      hours += '<div class="tl-hour" style="top:' + ((h - win.from) * PX_PER_HOUR) + 'px">' +
        '<span>' + String(h).padStart(2, '0') + ':00</span></div>';
    }

    var blocks = entries.map(function (entry) {
      var top = ((minutesOfDay(entry.start) - win.from * 60) / 60) * PX_PER_HOUR;
      var h = Math.max(20, (entry.durationMs / 3600000) * PX_PER_HOUR);
      var label = taskOf(entry).taskName || entry.description || 'Unmatched';
      var client = clientOf(entry) || 'No client';
      return '<div class="tl-block' + (entry.status === 'rejected' ? ' rejected' : '') +
        (state.selected === entry.id ? ' selected' : '') + '" data-id="' + entry.id + '"' +
        ' style="top:' + top + 'px;height:' + h + 'px;' +
        (hueFor(client) !== null ? '--h:' + hueFor(client) : '--h:250') + '"' +
        ' title="' + esc(label) + '">' +
        (h > 30 ? '<div class="who">' + esc(client) + '</div>' : '') +
        '<div class="len">' + clock(entry.start) + ' · ' + fmt(entry.durationMs) + '</div>' +
        (entry.status === 'synced' ? '' : '<div class="grip" data-grip="' + entry.id + '"></div>') +
        '</div>';
    }).join('');

    el.innerHTML =
      '<div class="tl-head"><span class="tl-title">Timeline</span>' +
      '<span class="tl-hint">drag to move · edge to resize</span></div>' +
      '<div class="tl-grid" style="height:' + height + 'px">' + hours + blocks + '</div>' +
      (win.stretched
        ? '<div class="tl-note">Some time falls outside ' +
          String(state.display.dayStartHour).padStart(2, '0') + ':00–' +
          String(state.display.dayEndHour).padStart(2, '0') + ':00.</div>'
        : '');
    state.window = win;
  }

  /* Dragging a block moves its start; dragging the grip changes its length. */
  /**
   * Drawing a new entry on empty timeline space. Deliberately the same gesture
   * as a calendar: press, drag down, release. Everything snaps to the block
   * grain, and a release shorter than one block still yields one block.
   */
  var draw = null;
  document.addEventListener('pointerdown', function (event) {
    if (event.target.closest && event.target.closest('.tl-block')) return;
    var grid = event.target.closest ? event.target.closest('.tl-grid') : null;
    if (!grid || state.view !== 'day') return;

    var rect = grid.getBoundingClientRect();
    var minutesFromTop = snapTo(((event.clientY - rect.top) / PX_PER_HOUR) * 60);
    draw = { grid: grid, startMin: state.window.from * 60 + minutesFromTop, y0: event.clientY, el: null };
    event.preventDefault();
  });

  document.addEventListener('pointermove', function (event) {
    if (!draw) return;
    var rect = draw.grid.getBoundingClientRect();
    var endMin = state.window.from * 60 + snapTo(((event.clientY - rect.top) / PX_PER_HOUR) * 60);
    var from = Math.min(draw.startMin, endMin);
    var to = Math.max(draw.startMin, endMin);
    var length = Math.max(minMin(), to - from);
    draw.from = Math.min(from, state.window.to * 60 - length);
    draw.length = length;

    if (!draw.el) {
      draw.el = document.createElement('div');
      draw.el.className = 'tl-draft';
      draw.grid.appendChild(draw.el);
    }
    draw.el.style.top = (((draw.from - state.window.from * 60) / 60) * PX_PER_HOUR) + 'px';
    draw.el.style.height = ((draw.length / 60) * PX_PER_HOUR) + 'px';
    draw.el.textContent = minutesToClock(draw.from) + ' · ' + fmt(draw.length * 60000);
  });

  document.addEventListener('pointerup', async function () {
    if (!draw) return;
    var finished = draw;
    draw = null;
    if (finished.el) finished.el.remove();
    if (!finished.length) return;
    await createEntry(finished.from, finished.length);
  });

  /** Minutes-since-midnight back to a clock label. */
  function minutesToClock(minutes) {
    var h = Math.floor(minutes / 60) % 24, m = Math.round(minutes % 60);
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  /**
   * Turn a minutes-of-day position back into a real timestamp for the day on
   * screen, going through the display zone so it lands on the right instant.
   */
  function timestampFor(minutes) {
    var anchor = state.day.entries.length ? state.day.entries[0].start : Date.now();
    var anchorMin = minutesOfDay(anchor);
    return anchor + (minutes - anchorMin) * 60000;
  }

  async function createEntry(minutesOfDayStart, lengthMinutes) {
    try {
      var data = await api('/api/entry', {
        method: 'POST',
        body: JSON.stringify({
          date: state.date,
          start: timestampFor(minutesOfDayStart),
          minutes: lengthMinutes
        })
      });
      state.day = data.day;
      renderGoal(data.summary);
      render();
      loadWeek(state.date);
      // Land the person straight in the task box — the entry is useless without one.
      var card = document.querySelector('.ent[data-id="' + data.entry.id + '"]');
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var box = card.querySelector('input[data-act="search"]');
        if (box) box.focus();
      }
      toast('Added ' + fmt(lengthMinutes * 60000) + ' at ' + minutesToClock(minutesOfDayStart) + '. Now pick its task.');
    } catch (e) { toast(e.message, true); }
  }

  var drag = null;
  document.addEventListener('pointerdown', function (event) {
    var grip = event.target.closest ? event.target.closest('.grip') : null;
    var block = event.target.closest ? event.target.closest('.tl-block') : null;
    if (!block) return;
    var entry = state.day.entries.filter(function (e) { return e.id === block.dataset.id; })[0];
    if (!entry || entry.status === 'synced') return;

    drag = {
      id: entry.id, mode: grip ? 'resize' : 'move', y0: event.clientY,
      start0: entry.start, dur0: entry.durationMs, el: block, moved: false
    };
    block.classList.add('dragging');
    block.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  document.addEventListener('pointermove', function (event) {
    if (!drag) return;
    var deltaMin = ((event.clientY - drag.y0) / PX_PER_HOUR) * 60;
    var snapped = snapTo(deltaMin);
    if (Math.abs(snapped) < snapMin() && !drag.moved) return;
    drag.moved = true;

    // Everything is clamped to the visible window, so a block can never be
    // dragged off the axis and lose its relationship to the hour labels.
    var win = state.window;
    var lo = win.from * 60;
    var hi = win.to * 60;
    var startMin0 = minutesOfDay(drag.start0);
    var durMin0 = drag.dur0 / 60000;

    if (drag.mode === 'move') {
      var wanted = startMin0 + snapped;
      var placed = Math.min(Math.max(wanted, lo), hi - durMin0);
      drag.newStart = drag.start0 + (placed - startMin0) * 60000;
      drag.newDur = drag.dur0;
      drag.el.style.top = (((placed - lo) / 60) * PX_PER_HOUR) + 'px';
    } else {
      var maxMin = hi - startMin0;
      var durMin = Math.min(Math.max(durMin0 + snapped, minMin()), maxMin);
      drag.newDur = durMin * 60000;
      drag.newStart = drag.start0;
      drag.el.style.height = Math.max(20, (durMin / 60) * PX_PER_HOUR) + 'px';
    }
    var len = drag.el.querySelector('.len');
    if (len) len.textContent = clock(drag.newStart) + ' · ' + fmt(drag.newDur);
  });

  document.addEventListener('pointerup', async function () {
    if (!drag) return;
    var finished = drag;
    drag = null;
    finished.el.classList.remove('dragging');
    if (!finished.moved) { select(finished.id); return; }

    try {
      await patch(finished.id, {
        start: finished.newStart,
        durationMinutes: Math.round(finished.newDur / 60000)
      });
      render();
      toast('Adjusted to ' + clock(finished.newStart) + ' · ' + fmt(finished.newDur));
    } catch (e) { toast(e.message, true); render(); }
  });

  function select(id) {
    state.selected = id;
    renderTimeline();
    var card = document.querySelector('.ent[data-id="' + id + '"]');
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
    }
  }

  /* ------------------------------------------------------------ entries -- */
  function renderEntry(entry) {
    var s = entry.suggestion;
    var r = taskOf(entry);
    var synced = entry.status === 'synced';
    var corrected = entry.corrected || (entry.taskId && entry.taskId !== s.taskId);
    // A corrected entry is no longer a guess; showing the matcher's old
    // confidence against a name a person chose by hand reads as nonsense.
    var pct = Math.round((s.confidence || 0) * 100);
    var confCls = corrected ? 'high' : s.confidence >= 0.7 ? 'high' : s.confidence >= 0.45 ? 'mid' : 'low';
    var confWord = corrected ? 'chosen by you' : s.confidence >= 0.7 ? 'confident' : s.confidence >= 0.45 ? 'unsure' : 'guess';
    var scope = [r.folderName, r.listName].filter(Boolean).map(esc).join(' › ');
    var why = (s.reasons || []).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('');
    var files = entry.evidence.paths.slice(0, 2).map(function (p) { return esc(p); }).join('<br>');
    var urls = entry.evidence.urls.slice(0, 1).map(function (u) { return esc(u); }).join('');

    return '<div class="card ent' + (clientOf(entry) ? '' : ' none') + '" data-status="' + entry.status + '"' +
      ' data-id="' + entry.id + '"' + hueStyle(entry) + '>' +

      '<div class="ent-state">' +
        '<button class="tick" data-act="toggle" title="' +
          (entry.status === 'approved' ? 'Approved — click to undo' :
           synced ? 'In ClickUp' : 'Approve this entry') + '"' + (synced ? ' disabled' : '') + '>' +
          ICON_TICK + '</button>' +
        (synced ? '' : '<button class="ent-kill" data-act="delete" title="Delete this entry">' + ICON_X + '</button>') +
      '</div>' +

      '<div class="ent-when">' +
        '<div class="range">' + clock(entry.start) + '–' + clock(entry.end) + '</div>' +
        '<div class="dur"><input type="number" min="' + minMin() + '" step="' + snapMin() + '" value="' + Math.round(entry.durationMs / 60000) + '"' +
          (synced ? ' disabled' : '') + ' data-act="duration"><span class="unit">min</span></div>' +
        '<div class="measured">measured ' + fmt(entry.activeMs) + '</div>' +
      '</div>' +

      '<div class="ent-what">' +
        '<input class="desc" type="text" value="' + esc(entry.description) + '"' + (synced ? ' disabled' : '') + ' data-act="description">' +
        '<div class="meta">' + esc(entry.evidence.apps.join(', ')) + '</div>' +
        (files || urls ? '<div class="paths">' + files + (urls ? (files ? '<br>' : '') + urls : '') + '</div>' : '') +
        (why ? '<ul class="why">' + why + '</ul>' : '') +
      '</div>' +

      '<div class="ent-task">' +
        '<span class="conf ' + confCls + '">' +
          (corrected ? confWord : pct + '% · ' + confWord) + '</span>' +
        '<div class="name' + (entry.taskId ? '' : ' empty') + '">' +
          (entry.taskId
            ? esc(r.taskName || ('Task ' + entry.taskId))
            : 'No task chosen') + '</div>' +
        (r.stale
          ? '<div class="scope stale">Not in the cached task list — run &ldquo;tracker catalog&rdquo; to refresh names.</div>'
          : '') +
        (scope ? '<div class="scope">' + scope + '</div>' : '') +
        (synced ? '' : '<input class="search" type="text" placeholder="Search tasks…" data-act="search">') +
        '<div class="ent-actions">' +
          (synced
            ? '<span class="conf high">in ClickUp</span>'
            : '<button class="btn" data-act="skip">' + (entry.status === 'rejected' ? 'Un-skip' : 'Skip') + '</button>' +
              '<label><input type="checkbox" data-act="billable"' + (entry.billable ? ' checked' : '') + '> billable</label>') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function render() {
    renderWeekStrip();
    var container = document.getElementById('entries');
    var entries = live(state.day.entries);
    if (!entries.length) {
      container.innerHTML = '<div class="card empty">No activity recorded for this day yet.</div>';
    } else {
      container.innerHTML = entries.map(renderEntry).join('');
    }
    renderTimeline();
  }

  async function patch(id, body) {
    var result = await api('/api/entry/' + encodeURIComponent(id), {
      method: 'POST',
      body: JSON.stringify(Object.assign({ date: state.date }, body))
    });
    var index = state.day.entries.findIndex(function (e) { return e.id === id; });
    if (index >= 0) state.day.entries[index] = result.entry;
    renderGoal(result.summary);
    return result.entry;
  }

  /* --------------------------------------------------------------- week -- */
  function renderWeek() {
    var el = document.getElementById('weekview');
    if (!state.week) { el.innerHTML = '<div class="empty">Loading…</div>'; return; }
    var days = state.week.days.slice(0, 5);
    var dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    var todayIso = todayInZone();
    var targetMs = state.targets.dailyMinutes * 60000;

    var totalLogged = days.reduce(function (s, d) { return s + d.summary.loggedMs; }, 0);
    var totalBillable = days.reduce(function (s, d) { return s + d.summary.billableMs; }, 0);
    var totalPending = days.reduce(function (s, d) { return s + d.summary.pendingMs; }, 0);
    var weekTarget = targetMs * 5;

    var cards = days.map(function (d, i) {
      var clients = Object.keys(d.byClient).sort(function (a, b) { return d.byClient[b] - d.byClient[a]; });
      var stack = clients.map(function (c) {
        var pct = (d.byClient[c] / Math.max(d.summary.loggedMs, 1)) * 100;
        return '<i style="width:' + pct + '%;background:hsl(' + hueFor(c) + ' var(--cl-s) var(--cl-l))"></i>';
      }).join('');
      var rows = clients.slice(0, 4).map(function (c) {
        return '<div><span><span class="sw" style="background:hsl(' + hueFor(c) + ' var(--cl-s) var(--cl-l))"></span>' +
          esc(c) + '</span><span>' + fmt(d.byClient[c]) + '</span></div>';
      }).join('');
      var cls = d.summary.loggedMs === 0 ? 'none' : (d.summary.loggedMs < targetMs ? 'short' : '');
      return '<button class="wk-day' + (d.date === todayIso ? ' today' : '') + '" data-goto="' + d.date + '" style="text-align:left">' +
        '<div class="d">' + dayNames[i] + '</div>' +
        '<div class="h ' + cls + '">' + hoursOnly(d.summary.loggedMs) + '</div>' +
        '<div class="wk-stack">' + stack + '</div>' +
        (rows ? '<div class="wk-clients">' + rows + '</div>' : '<div class="wk-clients"><div>Nothing logged</div></div>') +
        '</button>';
    }).join('');

    el.innerHTML =
      '<div class="wk-total">' +
        '<div><span class="k">Week logged</span><span class="v">' + fmt(totalLogged) + '</span></div>' +
        '<div><span class="k">Billable</span><span class="v">' + fmt(totalBillable) + '</span></div>' +
        '<div><span class="k">Target</span><span class="v">' + fmt(weekTarget) + '</span></div>' +
        '<div><span class="k">Still to review</span><span class="v">' + fmt(totalPending) + '</span></div>' +
      '</div>' +
      '<div class="wk-grid">' + cards + '</div>';
  }

  /* ----------------------------------------------------------- tracking -- */
  /**
   * "Is it actually watching Photoshop?" answered without a terminal. Three
   * failures look identical on a blank timesheet -- a dead observer, a missing
   * Accessibility grant, and a quiet day -- so this names which one it is, then
   * lists every app that has been in front and exactly how much of it the
   * tracker could read.
   */
  function pill(rate, samples) {
    if (samples === 0) return '<span class="tk-pill no">never</span>';
    if (rate >= 0.6) return '<span class="tk-pill yes">' + Math.round(rate * 100) + '%</span>';
    if (rate > 0) return '<span class="tk-pill part">' + Math.round(rate * 100) + '%</span>';
    return '<span class="tk-pill no">never</span>';
  }

  function renderTracking() {
    var el = document.getElementById('trackview');
    var t = state.tracking;
    if (!t) { el.innerHTML = '<div class="card"><div class="empty">Loading…</div></div>'; return; }

    var age = t.observer.ageSeconds;
    var banner;
    if (age === null) {
      banner = '<div class="tk-banner bad"><b>Nothing has been recorded today.</b>' +
        'The observer is not running, or it has not been given permission to start. ' +
        'Restart it from Terminal with <code>launchctl kickstart -k gui/$UID/com.motionbydesign.timetracker.observer</code>.</div>';
    } else if (age > 120) {
      banner = '<div class="tk-banner bad"><b>The last sample was ' + fmt(age * 1000) + ' ago.</b>' +
        'Samples should arrive every ' + t.sampleIntervalSeconds + ' seconds, so the observer has stopped. ' +
        'Restarting it: <code>launchctl kickstart -k gui/$UID/com.motionbydesign.timetracker.observer</code></div>';
    } else if (t.accessibility === 'missing') {
      banner = '<div class="tk-banner bad"><b>Recording, but it cannot see inside any window.</b>' +
        'Every app below reports its name and nothing else, which is what happens without Accessibility ' +
        'permission. Grant it in System Settings &rsaquo; Privacy &amp; Security &rsaquo; Accessibility to ' +
        '&ldquo;MBD Time Tracker&rdquo;, then restart the observer. Until then, matching has only the app ' +
        'name to work with.</div>';
    } else if (t.accessibility === 'unknown') {
      banner = '<div class="tk-banner"><b>Recording — too little activity yet to say more.</b>' +
        'Work in a couple of apps and come back.</div>';
    } else {
      banner = '<div class="tk-banner good"><b>Recording normally.</b>' +
        'Last sample ' + (age < 10 ? 'just now' : fmt(age * 1000) + ' ago') +
        ', and it can read inside windows. Anything at 0% below is an app that will not say ' +
        'which document is open — that time is still tracked, it just lands on the app alone.</div>';
    }

    var stats =
      '<div class="card tk-stats">' +
        '<div><span class="k">Active today</span><span class="v">' + fmt(t.observer.activeMs) + '</span></div>' +
        '<div><span class="k">Samples</span><span class="v">' + t.observer.totalSamples + '</span></div>' +
        '<div><span class="k">Apps seen</span><span class="v">' + t.apps.length + '</span></div>' +
        '<div><span class="k">Sampling every</span><span class="v">' + t.sampleIntervalSeconds + 's</span></div>' +
      '</div>';

    var rows = t.apps.map(function (a) {
      var sees = a.examplePath || a.exampleUrl || a.exampleTitle;
      return '<tr>' +
        '<td><div class="tk-app">' + esc(a.app) + '</div>' +
          '<div class="tk-bundle">' + esc(a.bundleId) + '</div></td>' +
        '<td class="num">' + fmt(a.activeMs) + '</td>' +
        '<td class="num">' + pill(a.titleRate, a.samples) + '</td>' +
        '<td class="num">' + pill(Math.max(a.pathRate, a.urlRate), a.samples) + '</td>' +
        '<td class="tk-sees">' + (sees ? esc(String(sees).slice(0, 110)) : '—') + '</td>' +
      '</tr>';
    }).join('');

    el.innerHTML = banner + stats +
      '<div class="card">' +
        (t.apps.length === 0
          ? '<div class="empty">No apps recorded yet today.</div>'
          : '<table class="tk-table"><thead><tr>' +
              '<th>App</th><th class="num">Active</th><th class="num">Window title</th>' +
              '<th class="num">File or page</th><th>Most recent thing it could see</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table>') +
      '</div>';
  }

  async function loadTracking(date) {
    state.tracking = await api('/api/tracking' + (date ? '?date=' + encodeURIComponent(date) : ''));
    if (state.view === 'tracking') renderTracking();
  }

  function setView(view) {
    state.view = view;
    document.getElementById('dayview').style.display = view === 'day' ? '' : 'none';
    document.getElementById('weekview').style.display = view === 'week' ? '' : 'none';
    document.getElementById('trackview').style.display = view === 'tracking' ? '' : 'none';
    document.getElementById('goal').style.display = view === 'day' && state.targets ? '' : 'none';
    document.querySelectorAll('#viewctl button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.view === view));
    });
    if (view === 'week') renderWeek();
    if (view === 'tracking') { renderTracking(); loadTracking(state.date); }
  }

  /* ---------------------------------------------------------------- load -- */
  async function loadWeek(date) {
    state.week = await api('/api/week' + (date ? '?date=' + encodeURIComponent(date) : ''));
    renderWeekStrip();
    if (state.view === 'week') renderWeek();
  }

  async function load(date) {
    var data = await api(date ? '/api/day?date=' + encodeURIComponent(date) : '/api/day');
    state.date = data.day.date;
    state.day = data.day;
    state.targets = data.targets || null;
    state.quickLog = data.quickLog || [];
    if (data.display) { state.display = data.display; setTimezone(data.display.timezone); }

    var quick = document.getElementById('quick');
    quick.innerHTML = state.quickLog.length
      ? '<span class="lbl">Quick log</span>' + state.quickLog.map(function (q) {
          return '<button class="btn ghost" data-quick="' + q.index + '" title="' + esc(q.taskName || q.label) + '">+ ' +
            esc(q.label) + ' ' + q.minutes + 'm</button>';
        }).join('')
      : '';

    document.getElementById('catalog').textContent = data.taskCount + ' tasks';
    renderGoal(data.summary);
    render();
    await loadWeek(state.date);
  }

  /* ------------------------------------------------------------- events -- */
  document.addEventListener('click', async function (event) {
    var t = event.target;

    var pill = t.closest ? t.closest('.daypill') : null;
    if (pill) { try { await load(pill.dataset.date); setView('day'); } catch (e) { toast(e.message, true); } return; }

    var goto = t.closest ? t.closest('[data-goto]') : null;
    if (goto) { try { await load(goto.dataset.goto); setView('day'); } catch (e) { toast(e.message, true); } return; }

    if (t.dataset && t.dataset.view) { setView(t.dataset.view); return; }

    if (t.dataset && t.dataset.quick !== undefined) {
      try {
        var q = state.quickLog[Number(t.dataset.quick)];
        var data = await api('/api/quick-log', {
          method: 'POST', body: JSON.stringify({ index: Number(t.dataset.quick), date: state.date })
        });
        state.day = data.day; renderGoal(data.summary); render(); loadWeek(state.date);
        toast('Logged ' + q.minutes + 'm — ' + q.label + '. Adjust on the entry if it ran longer.');
      } catch (e) { toast(e.message, true); }
      return;
    }

    var pick = t.closest ? t.closest('.results div[data-task-id]') : null;
    if (pick) {
      var card = pick.closest('.ent');
      try {
        // The server answers with the resolved task, so the card redraws with
        // the real ClickUp name rather than whatever the search row happened
        // to show.
        await patch(card.dataset.id, { taskId: pick.dataset.taskId });
        render(); loadWeek(state.date);
      } catch (e) { toast(e.message, true); }
      return;
    }

    var entCard = t.closest ? t.closest('.ent') : null;
    if (!entCard) return;
    var id = entCard.dataset.id;
    var act = t.closest('[data-act]') ? t.closest('[data-act]').dataset.act : null;

    try {
      if (act === 'toggle') {
        var entry = state.day.entries.filter(function (e) { return e.id === id; })[0];
        await patch(id, { status: entry.status === 'approved' ? 'pending' : 'approved' });
        render(); loadWeek(state.date);
      }
      if (act === 'delete') {
        await patch(id, { status: 'deleted' });
        render(); loadWeek(state.date);
        toast('Entry deleted. Rebuilding the day will not bring it back.');
      }
      if (act === 'skip') {
        var e2 = state.day.entries.filter(function (e) { return e.id === id; })[0];
        await patch(id, { status: e2.status === 'rejected' ? 'pending' : 'rejected' });
        render(); loadWeek(state.date);
      }
    } catch (e) { toast(e.message, true); }
  });

  document.addEventListener('change', async function (event) {
    var t = event.target;
    var card = t.closest ? t.closest('.ent') : null;
    if (!card || !t.dataset || !t.dataset.act) return;
    try {
      if (t.dataset.act === 'duration') {
        var wanted = Math.max(minMin(), snapTo(Number(t.value) || 0));
        await patch(card.dataset.id, { durationMinutes: wanted });
        render(); loadWeek(state.date);
      }
      if (t.dataset.act === 'description') await patch(card.dataset.id, { description: t.value });
      if (t.dataset.act === 'billable') { await patch(card.dataset.id, { billable: t.checked }); loadWeek(state.date); }
    } catch (e) { toast(e.message, true); }
  });

  var searchTimer = null;
  document.addEventListener('input', function (event) {
    var t = event.target;
    if (!t.dataset || t.dataset.act !== 'search') return;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async function () {
      var open = t.parentElement.querySelector('.results');
      if (open) open.remove();
      if (t.value.trim().length < 2) return;
      var data = await api('/api/tasks?q=' + encodeURIComponent(t.value.trim()));
      var box = document.createElement('div');
      box.className = 'results';
      box.innerHTML = data.tasks.map(function (task) {
        return '<div data-task-id="' + esc(task.taskId) + '" data-task-name="' + esc(task.taskName) + '">' +
          esc(task.taskName) + '<small>' + esc([task.folderName, task.listName].filter(Boolean).join(' › ')) + '</small></div>';
      }).join('') || '<div><small>No matches</small></div>';
      t.parentElement.appendChild(box);
    }, 220);
  });

  document.getElementById('addEntry').addEventListener('click', function () {
    // Start it after whatever is already logged, so a day builds forwards.
    var entries = live(state.day.entries);
    var after = entries.length
      ? Math.max.apply(null, entries.map(function (e) { return minutesOfDay(e.start) + e.durationMs / 60000; }))
      : state.window.from * 60;
    var length = Math.max(minMin(), snapMin() * 2);
    var startMin = Math.min(snapTo(after), state.window.to * 60 - length);
    createEntry(Math.max(state.window.from * 60, startMin), length);
  });

  document.getElementById('rebuild').addEventListener('click', async function () {
    try {
      var data = await api('/api/day/rebuild', { method: 'POST', body: JSON.stringify({ date: state.date }) });
      state.day = data.day; renderGoal(data.summary); render(); loadWeek(state.date);
      toast('Rebuilt from raw activity.');
    } catch (e) { toast(e.message, true); }
  });
  document.getElementById('approveAll').addEventListener('click', async function () {
    try {
      var data = await api('/api/day/approve-all', { method: 'POST', body: JSON.stringify({ date: state.date }) });
      state.day = data.day; renderGoal(data.summary); render(); loadWeek(state.date);
      toast('Approved ' + data.approved + ' entries.');
    } catch (e) { toast(e.message, true); }
  });
  document.getElementById('push').addEventListener('click', async function () {
    if (!confirm('Write all approved entries to ClickUp?')) return;
    try {
      var data = await api('/api/day/push', { method: 'POST', body: JSON.stringify({ date: state.date }) });
      state.day = data.day; renderGoal(data.summary); render(); loadWeek(state.date);
      var failed = data.result.failures.length;
      toast('Pushed ' + data.result.pushed + ' entries' + (failed ? ', ' + failed + ' failed' : '.'), failed > 0);
    } catch (e) { toast(e.message, true); }
  });

  // The tracking view is a live readout; anywhere else this would be churn.
  setInterval(function () {
    if (state.view !== 'tracking' || document.hidden) return;
    loadTracking(state.date).catch(function () {});
  }, 10000);

  load('').catch(function (e) { toast(e.message, true); });
})();
</script>
</body>
</html>
